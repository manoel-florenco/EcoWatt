spring.application.name=ecowatt
server.port=8081

# Banco embarcado e persistente: os dados ficam na pasta data/ do projeto.
spring.datasource.url=jdbc:h2:file:./data/ecowatt
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console didático do banco: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=never
